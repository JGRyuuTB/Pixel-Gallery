name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Pixel-Gallery-You.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Gallery-You-apk
          path: Pixel-Gallery-You.apk

      - name: Extract release notes from CHANGELOG (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '/^## /{ if (found) exit; if ($2 == v) { found=1; next } } found' CHANGELOG.md > RELEASE_NOTES.md
          echo "Release notes for $VERSION:"; cat RELEASE_NOTES.md

      - name: Publish GitHub Release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Pixel-Gallery-You.apk
          body_path: RELEASE_NOTES.md
