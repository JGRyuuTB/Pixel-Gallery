name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Pixel-Gallery-You.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Gallery-You-apk
          path: Pixel-Gallery-You.apk

      - name: Read version
        id: ver
        run: echo "v=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        if: github.event_name != 'pull_request'
        run: |
          VERSION="${{ steps.ver.outputs.v }}"
          awk -v v="$VERSION" '/^## /{ if (found) exit; if ($2 == v) { found=1; next } } found' CHANGELOG.md > RELEASE_NOTES.md
          echo "Release notes for $VERSION:"; cat RELEASE_NOTES.md

      - name: Publish GitHub Release (push to main or v* tag)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Pixel Gallery ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: Pixel-Gallery-You.apk
          body_path: RELEASE_NOTES.md
